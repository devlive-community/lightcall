<!DOCTYPE html>
<html lang="zh" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面未找到 - LightCall</title>
    <link rel="icon" href="../..//favicon.ico" type="image/x-icon">

    <!-- 基础样式文件 -->
    <link rel="stylesheet" href="/assets/pageforge.min.css">

    <script>
        (function () {
            document.addEventListener('click', function (e) {
                var link = e.target.closest('a');
                if (!link) return;

                const href = link.getAttribute('href');
                if (!href || href.startsWith('http') || href.startsWith('#')) return;

                e.preventDefault();

                // 获取目标语言
                const targetLang = href.split('/')[1];

                fetch(href)
                    .then(response => {
                        if (response.ok) {
                            window.location.href = href;
                        }
                        else {
                            window.location.href = `/${targetLang}/404.html`;
                        }
                    })
                    .catch(() => {
                        window.location.href = `/${targetLang}/404.html`;
                    });
            });
        })();
    </script>

    <!-- 加载主题配置中的额外 CSS 文件 -->
    

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<script>
    // 点击外部区域关闭移动端菜单
    document.addEventListener('click', function (event) {
        const mobileMenu = document.getElementById('mobile-menu');
        const menuButton = document.querySelector('button[onclick*="mobile-menu"]');

        if (!mobileMenu.contains(event.target) && !menuButton.contains(event.target) && !mobileMenu.classList.contains('hidden')) {
            mobileMenu.classList.add('hidden');
            menuButton.querySelector('svg:first-child').classList.remove('hidden');
            menuButton.querySelector('svg:last-child').classList.add('hidden');
        }
    });
</script>
